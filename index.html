<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>D-Day Widget</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; 
            overflow: hidden;
        }

        #timer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 위젯 바깥 여백 (노션 박스 안에서 여백 조절) */
            padding: 5%; 
            box-sizing: border-box;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 노션 임베드 박스 크기에 꽉 차게 설정 */
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #FCF9EC; 
        }

        .numbers {
            font-family: 'Montserrat', sans-serif;
            color: #4A3320;
            /* 폰트 크기를 화면 폭(vw)에 완벽하게 비례하도록 수정 */
            font-size: 15vw; 
            font-weight: 900;
            margin-bottom: 2vh; 
            letter-spacing: 0.5vw; 
        }

        .label {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            color: #C08A3F; 
            /* 하단 문구 크기도 화면 폭에 비례 */
            font-size: 5vw; 
            font-weight: 700;
            letter-spacing: 0.2vw;
        }
    </style>
</head>
<body>

<div id="timer">
    <div class="widget-container"> 
        <div id="d-day-number" class="numbers">D-0</div>
        <div class="label">GTQ id 1급</div>
    </div> 
</div>

<script>
    const targetDate = new Date('Sep 18, 2026 00:00:00').getTime();

    let timer = setInterval(function() {
        const today = new Date().getTime();
        const diff = targetDate - today;
        
        let days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        let dDayText = "";
        
        if (days > 0) {
            dDayText = "D-" + days;
        } else if (days === 0) {
            dDayText = "D-DAY";
        } else {
            dDayText = "D+" + Math.abs(days);
        }

        document.getElementById("d-day-number").innerText = dDayText;
    }, 1000); 
</script>
</body>
</html>
