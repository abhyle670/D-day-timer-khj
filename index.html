<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>D-Day Widget</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; 
            overflow: hidden;
        }

        #timer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 위젯 바깥 여백을 고정하여 일정하게 유지 */
            padding: 15px; 
            box-sizing: border-box;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #FCF9EC; 
            /* 노란색 네모 안쪽 여백(위, 아래, 양옆)을 일정하게 고정 */
            padding: 20px; 
            box-sizing: border-box;
        }

        .numbers {
            font-family: 'Montserrat', sans-serif;
            color: #4A3320;
            /* clamp(최소크기, 유동크기, 최대크기) 적용 */
            /* vmin을 사용하여 상자를 벗어나지 않게 비율 조절 */
            font-size: clamp(40px, 15vmin, 120px); 
            font-weight: 900;
            margin-bottom: 10px; 
            letter-spacing: 5px; 
        }

        .label {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            color: #C08A3F; 
            /* 하단 문구도 똑같이 최소/최대 크기 제한 적용 */
            font-size: clamp(16px, 5vmin, 36px); 
            font-weight: 700;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="timer">
    <div class="widget-container"> 
        <div id="d-day-number" class="numbers">D-0</div>
        <div class="label">GTQ id 1급</div>
    </div> 
</div>

<script>
    const targetDate = new Date('Sep 18, 2026 00:00:00').getTime();

    let timer = setInterval(function() {
        const today = new Date().getTime();
        const diff = targetDate - today;
        
        let days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        let dDayText = "";
        
        if (days > 0) {
            dDayText = "D-" + days;
        } else if (days === 0) {
            dDayText = "D-DAY";
        } else {
            dDayText = "D+" + Math.abs(days);
        }

        document.getElementById("d-day-number").innerText = dDayText;
    }, 1000); 
</script>
</body>
</html>
